<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="disc" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#262c4a"/>
      <stop offset="55%" stop-color="#141a30"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <radialGradient id="label" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffb3dc"/>
      <stop offset="60%" stop-color="#ff86c8"/>
      <stop offset="100%" stop-color="#ff5fb6"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="32" height="32" rx="7" fill="#0c1020"/>

  <!-- vinyl disc -->
  <circle cx="16" cy="16" r="12.5" fill="url(#disc)"/>

  <!-- grooves -->
  <g fill="none" stroke-opacity="0.55">
    <circle cx="16" cy="16" r="10.5" stroke="#39406a" stroke-width="0.7"/>
    <circle cx="16" cy="16" r="8.6"  stroke="#333a60" stroke-width="0.7"/>
    <circle cx="16" cy="16" r="6.7"  stroke="#2e3458" stroke-width="0.7"/>
  </g>

  <!-- gloss sweep -->
  <path d="M16 4.2 A11.8 11.8 0 0 1 27.8 16" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>

  <!-- center label -->
  <circle cx="16" cy="16" r="4.7" fill="url(#label)"/>
  <!-- spindle hole -->
  <circle cx="16" cy="16" r="1.05" fill="#0c1020"/>

  <!-- tonearm -->
  <g stroke="#e7ecff" stroke-opacity="0.9" stroke-linecap="round">
    <line x1="26.5" y1="6" x2="18.7" y2="13.5" stroke-width="1.4"/>
  </g>
  <circle cx="26.6" cy="5.9" r="1.5" fill="#20c2a4"/>
  <rect x="17.7" y="12.6" width="2.4" height="1.7" rx="0.5" transform="rotate(-44 18.9 13.4)" fill="#e7ecff"/>
</svg>
