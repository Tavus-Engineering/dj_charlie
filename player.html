<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Charlie — Bytebeat Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #05060d; overflow: hidden; }
    body {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, Consolas, monospace;
      color: #e6f6ff;
      position: relative;
    }

    #scope { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ── Now-playing HUD ── */
    #hud {
      position: absolute;
      left: 16px; right: 16px; bottom: 14px;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 14px; pointer-events: none;
      text-shadow: 0 0 12px rgba(0,0,0,0.9);
    }
    #np { min-width: 0; }
    #np-label {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: #38e8c8; opacity: 0.8; margin-bottom: 4px;
    }
    #np-expr {
      font-size: 15px; color: #d8faff; word-break: break-all; line-height: 1.4;
      max-width: 70vw;
    }
    #np-meta { font-size: 11px; color: #6f8aa0; margin-top: 6px; }
    #np-expr .hud-trk { color: #c9b6ff; font-weight: 700; }
    #np-expr .hud-trk.mut { color: #4b5d72; text-decoration: line-through; }
    #badge {
      font-size: 11px; letter-spacing: 1px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid #1f3b4d; background: rgba(8,18,28,0.7); color: #6f8aa0;
      white-space: nowrap; flex-shrink: 0;
    }
    #badge.playing { color: #38e8c8; border-color: #1d6b5c; box-shadow: 0 0 14px rgba(56,232,200,0.25); }

    /* ── Tap-to-enable overlay ── */
    #overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      background: radial-gradient(ellipse at center, rgba(8,14,26,0.6), rgba(3,4,9,0.92));
      cursor: pointer; z-index: 10;
    }
    #overlay.show { display: flex; }
    .play-ring {
      width: 96px; height: 96px; border-radius: 50%;
      border: 2px solid #38e8c8; display: flex; align-items: center; justify-content: center;
      font-size: 34px; color: #38e8c8; box-shadow: 0 0 40px rgba(56,232,200,0.35);
      transition: transform 0.12s;
    }
    #overlay:hover .play-ring { transform: scale(1.06); }
    #overlay p { font-size: 13px; color: #8fb3c4; letter-spacing: 1px; }
  </style>
</head>
<body>
  <canvas id="scope"></canvas>

  <div id="hud">
    <div id="np">
      <div id="np-label">Now Playing</div>
      <div id="np-expr">—</div>
      <div id="np-meta"></div>
    </div>
    <div id="badge">stopped</div>
  </div>

  <div id="overlay">
    <div class="play-ring">&#9654;</div>
    <p>tap to enable audio</p>
  </div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// DJ Charlie — self-hosted bytebeat player.
//
// Embedded in an iframe and driven by the parent via window.postMessage:
//   { type: 'set',     expr, rate, mode, play }   ← change beat (any field optional)
//   { type: 'play' }                              ← start audio
//   { type: 'stop' }                              ← stop audio
//   { type: 'volume',  value }                    ← 0..1
//   { type: 'reset' }                             ← rewind the t counter
//
// Also loads a beat from URL params for standalone use:
//   player.html?expr=t*(t>>5|t>>8)&rate=8000&mode=bytebeat&play=1
//
// Emits back to the parent:
//   { type: 'ready' }                             ← worklet loaded
//   { type: 'state', playing, suspended, expr, rate, mode }
//   { type: 'error', message }
// ─────────────────────────────────────────────────────────────────────────

// ── AudioWorklet processor source (loaded via Blob URL — keeps this single-file) ──
const WORKLET_SRC = `
function makeFn(expr) {
  const body = '"use strict";' +
    'var sin=Math.sin,cos=Math.cos,tan=Math.tan,floor=Math.floor,ceil=Math.ceil,' +
    'abs=Math.abs,sqrt=Math.sqrt,pow=Math.pow,log=Math.log,log2=Math.log2,exp=Math.exp,' +
    'min=Math.min,max=Math.max,atan=Math.atan,PI=Math.PI,E=Math.E,int=Math.floor,r=Math.round;' +
    'return (' + expr + ');';
  return new Function('t', body);
}

class BytebeatProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.audioRate = sampleRate; // global in worklet scope; real device rate
    this.playing = false;
    // Each track is an independent bytebeat voice; they are summed (mixed) per sample.
    // name -> { fn, pendingFn, crossfade, t, rate, mode, gain, mute }
    this.tracks = new Map();

    this.port.onmessage = (e) => {
      const m = e.data || {};
      switch (m.type) {
        case 'track':       this.upsert(m.name || 'lead', m); break;
        case 'removeTrack': this.tracks.delete(m.name); break;
        case 'clearTracks': this.tracks.clear(); break;
        case 'reset':       for (const tr of this.tracks.values()) tr.t = 0; break;
        case 'playing':     this.playing = !!m.value; break;
        case 'config':      this.audioRate = m.audioRate || sampleRate; break;
      }
    };
  }

  upsert(name, m) {
    let tr = this.tracks.get(name);
    if (!tr) { tr = { fn: () => 0, pendingFn: null, crossfade: 0, t: 0, rate: 8000, mode: 'bytebeat', gain: 1, mute: false }; this.tracks.set(name, tr); }
    if (m.rate != null) tr.rate = +m.rate || 8000;
    if (m.mode != null) tr.mode = m.mode;
    if (m.gain != null) tr.gain = +m.gain;
    if (m.mute != null) tr.mute = !!m.mute;
    if (typeof m.expr === 'string' && m.expr.trim()) {
      try {
        const f = makeFn(m.expr); f(0); // smoke test — throw now, not in the audio loop
        if (this.playing) { tr.pendingFn = f; tr.crossfade = 1024; } // crossfade (incl. fade-in from silence)
        else { tr.fn = f; tr.pendingFn = null; tr.crossfade = 0; }
        this.port.postMessage({ type: 'compiled', ok: true, name });
      } catch (err) {
        this.port.postMessage({ type: 'compiled', ok: false, name, message: String(err) });
      }
    }
  }

  shape(raw, mode) {
    let s;
    switch (mode) {
      case 'signedbytebeat': s = (((raw + 128) & 255) - 128) / 128; break;
      case 'floatbeat':      s = raw; break;
      default:               s = ((raw & 255) - 128) / 128; // bytebeat (unsigned 8-bit)
    }
    return Number.isFinite(s) ? (s < -1 ? -1 : s > 1 ? 1 : s) : 0;
  }

  process(inputs, outputs) {
    const out = outputs[0][0];
    if (!out) return true;
    if (!this.playing || this.tracks.size === 0) { out.fill(0); return true; }

    const tracks = [...this.tracks.values()];
    const audioRate = this.audioRate;
    for (let i = 0; i < out.length; i++) {
      let mix = 0;
      for (let j = 0; j < tracks.length; j++) {
        const tr = tracks[j];
        const ti = Math.floor(tr.t);
        let s = 0;
        try { s = this.shape(tr.fn(ti), tr.mode); } catch (_) { s = 0; }

        // Crossfade old → new expression to mask the discontinuity click.
        if (tr.pendingFn && tr.crossfade > 0) {
          let sn = 0;
          try { sn = this.shape(tr.pendingFn(ti), tr.mode); } catch (_) { sn = 0; }
          const k = tr.crossfade / 1024;          // 1 → 0
          s = s * k + sn * (1 - k);
          if (--tr.crossfade === 0) { tr.fn = tr.pendingFn; tr.pendingFn = null; }
        }

        if (!tr.mute) mix += s * tr.gain;
        tr.t += tr.rate / audioRate;
        if (tr.t >= 1e15) tr.t -= 1e15; // protect float precision on long runs
      }
      out[i] = mix < -1 ? -1 : mix > 1 ? 1 : mix; // clip the summed mix
    }
    return true;
  }
}
registerProcessor('bytebeat-processor', BytebeatProcessor);
`;

// ── State ──
let ctx = null, node = null, gain = null, analyser = null, scopeData = null;
let ready = false, playing = false, volume = 0.5;
// Mirror of the worklet's tracks (for HUD + state reporting).
// name -> { expr, rate, mode, gain, mute }
const tracks = new Map();

const $ = (id) => document.getElementById(id);
const overlay = $('overlay');
const badge   = $('badge');
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

// ── Audio init (lazy: created/resumed on a user gesture) ──
async function ensureAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const blobUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(blobUrl);
  URL.revokeObjectURL(blobUrl);

  node = new AudioWorkletNode(ctx, 'bytebeat-processor', {
    numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1],
  });
  node.port.onmessage = (e) => {
    const m = e.data || {};
    if (m.type === 'compiled' && !m.ok) postParent({ type: 'error', message: m.message, track: m.name });
  };
  node.port.postMessage({ type: 'config', audioRate: ctx.sampleRate });

  gain = ctx.createGain();
  gain.gain.value = volume;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  scopeData = new Uint8Array(analyser.fftSize);

  node.connect(gain).connect(analyser).connect(ctx.destination);

  ctx.onstatechange = () => emitState();

  // Push whatever tracks were queued before audio existed.
  for (const [name, tr] of tracks) {
    node.port.postMessage({ type: 'track', name, expr: tr.expr || undefined, rate: tr.rate, mode: tr.mode, gain: tr.gain, mute: tr.mute });
  }
  ready = true;
  postParent({ type: 'ready' });
}

// Create or update a named track (the engine mixes all tracks together).
function setTrack(name, opts, announce = true) {
  name = name || 'lead';
  const prev = tracks.get(name) || { expr: '', rate: 8000, mode: 'bytebeat', gain: 1, mute: false };
  const tr = { ...prev };
  if (opts.expr != null) tr.expr = String(opts.expr);
  if (opts.rate != null) tr.rate = +opts.rate || 8000;
  if (opts.mode != null) tr.mode = opts.mode;
  if (opts.gain != null) tr.gain = +opts.gain;
  if (opts.mute != null) tr.mute = !!opts.mute;
  tracks.set(name, tr);
  renderHud();
  if (node) node.port.postMessage({
    type: 'track', name,
    expr: opts.expr != null ? tr.expr : undefined,  // only recompile when expr was supplied
    rate: tr.rate, mode: tr.mode, gain: tr.gain, mute: tr.mute,
  });
  if (announce) emitState();
}

function removeTrack(name) {
  tracks.delete(name);
  renderHud();
  if (node) node.port.postMessage({ type: 'removeTrack', name });
  emitState();
}

function clearTracks() {
  tracks.clear();
  renderHud();
  if (node) node.port.postMessage({ type: 'clearTracks' });
  emitState();
}

// Legacy single-beat path → the "lead" track.
function applyBeat(beat, announce = true) { setTrack('lead', beat, announce); }

function renderHud() {
  const list = [...tracks.entries()].filter(([, t]) => t.expr && t.expr.trim());
  const npExpr = $('np-expr'), npMeta = $('np-meta'), npLabel = $('np-label');
  if (!list.length) { npLabel.textContent = 'Now Playing'; npExpr.textContent = '—'; npMeta.textContent = ''; return; }
  if (list.length === 1) {
    npLabel.textContent = list[0][0] === 'lead' ? 'Now Playing' : list[0][0];
    npExpr.textContent = list[0][1].expr;
    npMeta.textContent = `${list[0][1].rate} Hz · ${list[0][1].mode}`;
  } else {
    npLabel.textContent = `${list.length} tracks`;
    npExpr.innerHTML = list.map(([n, t]) =>
      `<span class="hud-trk${t.mute ? ' mut' : ''}">${esc(n)}</span> ${esc(t.expr)}`).join('<br>');
    npMeta.textContent = '';
  }
}

async function play() {
  await ensureAudio();
  await ctx.resume();
  if (ctx.state !== 'running') { overlay.classList.add('show'); emitState(); return; }
  overlay.classList.remove('show');
  playing = true;
  node.port.postMessage({ type: 'playing', value: true });
  setBadge();
  emitState();
}

function stop() {
  playing = false;
  if (node) node.port.postMessage({ type: 'playing', value: false });
  setBadge();
  emitState();
}

function setVolume(v) {
  volume = Math.max(0, Math.min(1, v));
  if (gain && ctx) gain.gain.setTargetAtTime(volume, ctx.currentTime, 0.02); // click-free ramp
}

function setBadge() {
  badge.textContent = playing ? '● live' : 'stopped';
  badge.classList.toggle('playing', playing);
}

// ── Parent ↔ iframe messaging ──
function postParent(msg) {
  try { window.parent && window.parent !== window && window.parent.postMessage(msg, '*'); } catch (_) {}
}
function emitState() {
  const list = [...tracks.entries()].filter(([, t]) => t.expr && t.expr.trim());
  const lead = tracks.get('lead');
  postParent({
    type: 'state', playing,
    suspended: !ctx || ctx.state !== 'running',
    tracks: list.map(([n]) => n),
    expr: lead ? lead.expr : (list[0] ? list[0][1].expr : ''),
    rate: lead ? lead.rate : 8000,
    mode: lead ? lead.mode : 'bytebeat',
  });
}

window.addEventListener('message', (e) => {
  const m = e.data;
  if (!m || typeof m.type !== 'string') return;
  switch (m.type) {
    case 'set': {  // legacy single-beat → the "lead" track
      const beat = {};
      if (typeof m.expr === 'string' && m.expr.trim()) beat.expr = m.expr.trim();
      if (m.rate != null) beat.rate = +m.rate;
      if (typeof m.mode === 'string') beat.mode = m.mode;
      applyBeat(beat);
      if (m.play) play();
      break;
    }
    case 'track': {  // create/update a named track in the mix
      const opts = {};
      if (typeof m.expr === 'string') opts.expr = m.expr;
      if (m.rate != null) opts.rate = +m.rate;
      if (typeof m.mode === 'string') opts.mode = m.mode;
      if (m.gain != null) opts.gain = +m.gain;
      if (m.mute != null) opts.mute = !!m.mute;
      setTrack(m.name || 'lead', opts);
      if (m.play) play();
      break;
    }
    case 'removeTrack': removeTrack(m.name); break;
    case 'clearTracks': clearTracks(); break;
    case 'play':   play(); break;
    case 'stop':   stop(); break;
    case 'volume': setVolume(+m.value); break;
    case 'reset':  if (node) node.port.postMessage({ type: 'reset' }); break;
  }
});

// Tap-to-enable overlay (own-frame gesture — the reliable autoplay unlock).
overlay.addEventListener('click', () => play());

// ── Oscilloscope visualizer ──
const canvas = $('scope');
const g = canvas.getContext('2d');
function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

let hue = 168;
function draw() {
  requestAnimationFrame(draw);
  const W = canvas.width, H = canvas.height;
  g.fillStyle = 'rgba(5,6,13,0.28)';
  g.fillRect(0, 0, W, H);

  if (!analyser || !playing) {
    // idle baseline
    g.strokeStyle = 'rgba(56,232,200,0.25)';
    g.lineWidth = 1 * devicePixelRatio;
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
    return;
  }

  analyser.getByteTimeDomainData(scopeData);
  hue = (hue + 0.4) % 360;
  g.lineWidth = 2 * devicePixelRatio;
  g.strokeStyle = `hsl(${hue}, 90%, 62%)`;
  g.shadowBlur = 18 * devicePixelRatio;
  g.shadowColor = `hsl(${hue}, 90%, 62%)`;
  g.beginPath();
  const n = scopeData.length, slice = W / n;
  for (let i = 0; i < n; i++) {
    const v = scopeData[i] / 128 - 1;      // -1..1
    const y = H / 2 + v * (H / 2) * 0.9;
    const x = i * slice;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.stroke();
  g.shadowBlur = 0;
}
draw();

// ── Standalone URL-param loading ──
(function bootFromUrl() {
  const p = new URLSearchParams(location.search);
  const beat = {};
  if (p.get('expr')) beat.expr = p.get('expr');
  if (p.get('rate')) beat.rate = +p.get('rate');
  if (p.get('mode')) beat.mode = p.get('mode');
  if (beat.expr || beat.rate || beat.mode) applyBeat(beat, false);
  if (p.get('play') === '1') {
    // Can't autoplay without a gesture — surface the overlay.
    overlay.classList.add('show');
  }
  setBadge();
  emitState();
})();
</script>
</body>
</html>
